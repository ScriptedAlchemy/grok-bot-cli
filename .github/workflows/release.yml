name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: changesets-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Test
        run: npm test

      - name: Build the plugin distribution (gbot-install bin + host projections)
        run: npm run build:plugin

      - name: Lint the package
        run: npx --yes publint@0.3.24

      - name: Pack and smoke-test the executable
        shell: bash
        run: |
          package_root=$(mktemp -d)
          install_root=$(mktemp -d)
          npm pack --pack-destination "$package_root"
          package_files=("$package_root"/*.tgz)
          test -f "${package_files[0]}"
          test "${#package_files[@]}" -eq 1
          npm install --global --prefix "$install_root" "${package_files[0]}"
          "$install_root/bin/gbot" --help
          "$install_root/bin/gbot-install" --help
          fake_home=$(mktemp -d)
          mkdir -p "$fake_home/.cursor"
          HOME="$fake_home" "$install_root/bin/gbot-install" install cursor --json
          test -f "$fake_home/.cursor/plugins/local/grok-bot/.agent-bundle-install.json"

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-base-branch: main
          commit-message: Release packages
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npm run release
          pr-title: Release packages
